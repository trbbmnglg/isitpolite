<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 52" role="img" aria-label="IsItPolite.com — Connecting Cultures with Confidence">
  <defs>
    <clipPath id="gc">
      <circle cx="26" cy="26" r="22"/>
    </clipPath>
    <radialGradient id="gg" cx="38%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#7DDBD5"/>
      <stop offset="100%" stop-color="#3DADA8"/>
    </radialGradient>
  </defs>

  <!-- Globe: ocean -->
  <circle cx="26" cy="26" r="22" fill="url(#gg)"/>

  <!-- Continents + grid lines, clipped to globe -->
  <g clip-path="url(#gc)">
    <!-- North America -->
    <path d="M9,9 C7,11 6,16 8,20 C9,23 8,26 10,27 C12,28 14,25 15,22 C16,19 16,14 14,11 C13,10 10,8 9,9Z" fill="#FF756C"/>
    <!-- South America -->
    <path d="M13,29 C12,31 12,35 14,39 C15,42 17,43 19,41 C20,38 20,34 18,30 C17,28 15,27 13,29Z" fill="#FF756C"/>
    <!-- Europe -->
    <path d="M26,8 C25,9 25,12 27,14 C29,15 31,14 31,12 C31,10 30,8 28,8 C27,8 26,8 26,8Z" fill="#FF756C"/>
    <!-- Africa -->
    <path d="M28,17 C27,18 27,22 28,27 C29,31 30,35 31,37 C33,38 35,37 35,34 C36,31 35,26 34,22 C33,19 31,17 29,17 C28,17 28,17 28,17Z" fill="#FF756C"/>
    <!-- Asia -->
    <path d="M33,8 C35,6 40,7 43,10 C45,13 45,16 43,18 C41,20 38,19 36,17 C34,15 33,12 33,8Z" fill="#FF756C"/>
    <!-- Australia -->
    <path d="M38,33 C40,32 43,33 44,36 C44,38 42,40 40,38 C38,37 37,35 38,33Z" fill="#FF756C"/>

    <!-- Latitude lines -->
    <line x1="4" y1="26" x2="48" y2="26" stroke="white" stroke-width="0.5" opacity="0.3"/>
    <line x1="4" y1="17" x2="48" y2="17" stroke="white" stroke-width="0.5" opacity="0.3"/>
    <line x1="4" y1="35" x2="48" y2="35" stroke="white" stroke-width="0.5" opacity="0.3"/>
    <!-- Meridians -->
    <ellipse cx="26" cy="26" rx="12" ry="22" fill="none" stroke="white" stroke-width="0.5" opacity="0.3"/>
    <ellipse cx="26" cy="26" rx="5"  ry="22" fill="none" stroke="white" stroke-width="0.5" opacity="0.3"/>
  </g>

  <!-- Globe ring highlight -->
  <circle cx="26" cy="26" r="22" fill="none" stroke="white" stroke-width="1.5" opacity="0.45"/>

  <!-- Leaf branches -->
  <path d="M10,46 C7,42 9,37 14,36 C12,40 11,44 13,47 C12,48 11,47 10,46Z" fill="#55BAB4" opacity="0.75"/>
  <path d="M42,46 C45,42 43,37 38,36 C40,40 41,44 39,47 C40,48 41,47 42,46Z" fill="#55BAB4" opacity="0.75"/>

  <!-- Wordmark: IsItPolite -->
  <text x="58" y="24" font-family="'Trebuchet MS','Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#252523" letter-spacing="-0.3">IsItPolite<tspan fill="#FF756C">.com</tspan></text>

  <!-- Tagline -->
  <text x="59" y="40" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#B5B3B4" letter-spacing="0.1">Connecting Cultures with Confidence</text>
</svg>
